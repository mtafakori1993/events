apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: events
  namespace: events
  labels: {app: events}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: le     # production Let's Encrypt (HTTP-01); DNS for the host is already verified
spec:
  rules:
    - host: events.tafakorpardazan.ir
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: events, port: {number: 80}}}
